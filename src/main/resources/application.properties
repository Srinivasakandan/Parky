# Server Configuration
server.port=8080
server.servlet.context-path=/

# Application Name
spring.application.name=smart-parking-system

# Primary Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/smart_parking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Srinix@2007
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security & Session Configuration
spring.session.store-type=none
server.servlet.session.timeout=30m

# Jackson Date Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
